[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfE"
markers = [
  "live: needs the full stack from scripts/demo.sh (workers, Java service, LocalStack)",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
