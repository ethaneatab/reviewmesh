# reviewmesh local stack. Only state lives in containers; the services run on the host
# (see scripts/demo.sh) so the shared colima VM stays small.
name: reviewmesh
services:
  postgres:
    image: postgres:16-alpine
    ports: ["54390:5432"]
    environment:
      POSTGRES_USER: reviewmesh
      POSTGRES_PASSWORD: reviewmesh-dev   # local placeholder
      POSTGRES_DB: reviewmesh
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=150", "-c", "work_mem=2MB"]
    volumes:
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewmesh -d reviewmesh"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7-alpine
    ports: ["63590:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  localstack:
    # 4.9 is pinned on purpose: newer images need an auth token.
    image: localstack/localstack:4.9
    ports: ["45690:4566"]
    environment:
      SERVICES: s3,sqs,lambda,logs,iam,sts
      SQS_ENDPOINT_STRATEGY: path
      # Lambda containers join this network so the handler reaches postgres:5432 and localstack:4566.
      LAMBDA_DOCKER_NETWORK: reviewmesh_default
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "60"
      LAMBDA_KEEPALIVE_MS: "600000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:4566/_localstack/health | grep -q lambda"]
      interval: 3s
      retries: 60
  # Optional, not started by demo.sh: docker-compose -p reviewmesh --profile obs up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["obs"]
    ports: ["8896:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    mem_limit: 128m
  grafana:
    image: grafana/grafana:12.2.1
    profiles: ["obs"]
    ports: ["8897:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 192m
volumes:
  pgdata: {}
