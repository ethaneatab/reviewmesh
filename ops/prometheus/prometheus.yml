# Optional observability stack: docker-compose -p reviewmesh --profile obs up -d
global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: intake
    static_configs: [{targets: ["host.docker.internal:8890"]}]
  - job_name: workers
    static_configs: [{targets: ["host.docker.internal:8892", "host.docker.internal:8893", "host.docker.internal:8894", "host.docker.internal:8895"]}]
  - job_name: routing
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8891"]}]
