name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: ruff + mypy
        run: .venv/bin/ruff check rmflow tests scripts lambdas && .venv/bin/mypy rmflow
      - name: anchors, narration, problem walkthroughs
        run: |
          .venv/bin/python scripts/check_anchors.py
          .venv/bin/python scripts/check_narration.py
          .venv/bin/python scripts/build_problem_videos.py > /dev/null
      - name: frontend typecheck + build
        run: cd frontend && npm ci && npm run build
      - name: java compile + SpotBugs
        run: cd routing-svc && mvn -q -DskipTests compile spotbugs:check

  tests:
    runs-on: ubuntu-latest
    needs: checks
    env:
      COMPOSE: docker compose
      JAVA_HOME_21: /opt/java21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: ln -s "$JAVA_HOME" /opt/java21 || sudo ln -s "$JAVA_HOME" /opt/java21
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: containers (Postgres, Redis, LocalStack 4.9)
        run: docker compose -p reviewmesh up -d --wait
      - name: java tests (contracts, migration side-by-side, rollout policy)
        run: cd routing-svc && mvn -q test
      - name: python tests (without the live ones)
        run: .venv/bin/python -m pytest -m "not live"
      - name: failing controls
        run: ./scripts/failing-controls.sh
      - name: full stack + live tests + e2e
        run: |
          ./scripts/demo.sh
          .venv/bin/python scripts/seed_records.py 600
          .venv/bin/python -m pytest -m live
          npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: always()
        run: ./scripts/stop.sh; docker compose -p reviewmesh down -v
